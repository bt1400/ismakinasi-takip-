name: APK Derle

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketleri kur
        run: npm install

      - name: Android projesini olustur
        run: npx cap add android

      - name: Uygulama ikonunu olustur
        run: npx capacitor-assets generate --android --iconBackgroundColor '#f59e0b' --iconBackgroundColorDark '#f59e0b' || echo "Ikon olusturulamadi, varsayilan ikon kullanilacak"

      - name: Dosyalari Android projesine aktar
        run: npx cap sync android

      - name: Sabit imza anahtarini kullan
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: is-makinasi-takip-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
